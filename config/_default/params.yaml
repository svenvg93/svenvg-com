# Basic site info with SEO
description: "Sven van Ginkel — a network engineer explaining how networking technologies actually work, from WiFi 7 and XGS-PON to IPv6, encrypted DNS, and TR-369, shaped by real ISP experience."
keywords: ["Networking", "Network Engineering", "WiFi 7", "IPv6", "XGS-PON", "Fiber", "DNS", "TR-369", "ISP", "Homelab"]
defaultAuthor: "Sven van Ginkel"
language: "en-US"
shortName: "Sven van Ginkel"  # PWA
images:
- "/image.png"

favicon:
  svg: "/favicon.svg"

header:
  sticky: true
  logo:
    image: "/image.png"
    link: "/"
  showThemeSwitch: false
  showDarkModeSwitch: true
  showContentWidthSwitch: false
  showLanguageSwitch: false
  languageSwitchMode: "dropdown"  # dropdown | cycle

author:
  name: "Sven van Ginkel"
  title: "Network Engineer • ISP & CPE • Homelab"
  description: "I design CPE and provisioning systems for an ISP by day, and break things in my homelab by night — writing about how the technologies behind both actually work."
  avatar: "/image.png"
  social:
    - name: "GitHub"
      url: "https://github.com/svenvg93"
      icon: "github"
    - name: "X"
      url: "https://x.com/svenvginkel"
      icon: "twitter"
    - name: "LinkedIn"
      url: "https://linkedin.com/in/svenvanginkel"
      icon: "linkedin"

colorScheme: "default"

home:
  recentPostsCount: 4
  contentOrder:
    - author-section
    - recent-posts
    - page-content
    - featured-projects.html

post:
  showRelated: true
  relatedPostsCount: 2
  license:
    show: true
    author: "Sven van Ginkel"
    name: "CC BY-NC-SA 4.0"
    description: "This work is licensed under a Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License. Please attribute the source, use non-commercially, and maintain the same license."
    url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    displayName: "CC BY-NC-SA 4.0"

# comments
comments:
  enabled: false

analytics:
  enabled: false
  baidu:
    enabled: false
    id: "your-baidu-analytics-id"
  clarity:
    enabled: false
    id: "your-clarity-analytics-id"
  google:
    enabled: false
    id: "your-google-analytics-id"
  umami:
    enabled: false
    id: "your-umami-website-id"
    src: "https://umami.com/myscript.js"
    domains: "example.domain.com"


katex:
  enabled: false
  delimiters:
    - left: "$$"
      right: "$$"
      display: true
    - left: "$"
      right: "$"
      display: false
    - left: "\\("
      right: "\\)"
      display: false
    - left: "\\["
      right: "\\]"
      display: true

mermaid:
  enabled: true

gallery:
  enabled: true
  defaultLayout: justified  # justified | masonry | grid
  gap: 10
  targetRowHeight: 200
  lastRowBehavior: center   # left | center | right | fill | hide
  columnWidth: 200
  columns: 4
  lightbox:
    enabled: false
    bgOpacity: 0.8
    showHideAnimationType: zoom
    showAnimationDuration: 333
    hideAnimationDuration: 333

codeblock:
  collapse:
    enabled: true
    defaultState: expanded  # expanded | collapsed
    autoCollapseLines: 30
    autoCollapseHeight: 400
    collapsedHeight: 120

readingProgress:
  enabled: true
  showOnHomepage: false

dock: "always" # scroll | always | float

# TOC (Table of Contents)
toc:
  enabled: true # Enable or disable TOC globally
  position: "side" # Options: center | side
  pinned: true # Side mode only: keep the TOC panel always visible when there is enough space