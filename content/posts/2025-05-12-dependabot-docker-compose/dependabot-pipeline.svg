<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#475569"/>
    </marker>
    <marker id="arr-violet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect width="700" height="200" fill="url(#bg)" rx="8"/>

  <!-- Box 1: source files (160px) -->
  <rect x="18" y="70" width="160" height="60" fill="none" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="98" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">docker-compose.yml</text>
  <text x="98" y="114" text-anchor="middle" font-size="9" fill="#94a3b8">scattered across the repo</text>

  <line x1="178" y1="100" x2="191" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- Box 2: script (200px — longest label) -->
  <rect x="193" y="70" width="200" height="60" fill="none" stroke="#8b5cf6" stroke-width="1.5" rx="5"/>
  <text x="293" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">generate-dependabot.sh</text>
  <text x="293" y="108" text-anchor="middle" font-size="9" fill="#a78bfa" opacity="0.8">run by GitHub Actions</text>
  <text x="293" y="122" text-anchor="middle" font-size="8" fill="#7c6bb0">on every push</text>

  <line x1="393" y1="100" x2="406" y2="100" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-violet)"/>

  <!-- Box 3: generated config (140px) -->
  <rect x="408" y="70" width="140" height="60" fill="none" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="478" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">dependabot.yml</text>
  <text x="478" y="114" text-anchor="middle" font-size="9" fill="#94a3b8">committed, kept in sync</text>

  <line x1="548" y1="100" x2="561" y2="100" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>

  <!-- Box 4: Dependabot outcome (120px) -->
  <rect x="563" y="70" width="120" height="60" fill="none" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="623" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#86efac">Dependabot</text>
  <text x="623" y="108" text-anchor="middle" font-size="9" fill="#34d399" opacity="0.8">monthly scan</text>
  <text x="623" y="122" text-anchor="middle" font-size="8" fill="#2fae82">opens a pull request</text>
</svg>
