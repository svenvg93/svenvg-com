<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="700" height="200" fill="url(#bg)" rx="8"/>

  <!-- Box 1: Hugo site (120px) -->
  <rect x="28" y="70" width="120" height="60" fill="none" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="88" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">Hugo site</text>
  <text x="88" y="114" text-anchor="middle" font-size="9" fill="#94a3b8">local git repo</text>

  <line x1="148" y1="100" x2="171" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>

  <!-- Box 2: GitHub (110px) -->
  <rect x="173" y="70" width="110" height="60" fill="none" stroke="#475569" stroke-width="1.5" rx="5"/>
  <text x="228" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">GitHub</text>
  <text x="228" y="114" text-anchor="middle" font-size="9" fill="#94a3b8">push triggers deploy</text>

  <line x1="283" y1="100" x2="306" y2="100" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>

  <!-- Box 3: Cloudflare Workers build (190px — longest label) -->
  <rect x="308" y="70" width="190" height="60" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="403" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#bae6fd">Cloudflare Workers</text>
  <text x="403" y="108" text-anchor="middle" font-size="9" fill="#38bdf8" opacity="0.8">hugo build --minify</text>
  <text x="403" y="122" text-anchor="middle" font-size="8" fill="#2a94c0">via wrangler.jsonc</text>

  <line x1="498" y1="100" x2="521" y2="100" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Box 4: Global network (150px) -->
  <rect x="523" y="70" width="150" height="60" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="598" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#bae6fd">Global Network</text>
  <text x="598" y="108" text-anchor="middle" font-size="9" fill="#38bdf8" opacity="0.8">serves static assets</text>
  <text x="598" y="122" text-anchor="middle" font-size="8" fill="#2a94c0">yourdomain.com</text>
</svg>
