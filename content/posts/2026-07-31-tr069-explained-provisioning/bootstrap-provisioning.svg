<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 7,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="760" height="230" fill="url(#bg)" rx="8"/>

  <text x="380" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">ZERO-TOUCH PROVISIONING &#8212; FACTORY TO FULLY CONFIGURED</text>

  <!-- Step 1: Factory default -->
  <rect x="18" y="60" width="116" height="80" fill="#150a00" stroke="#f97316" stroke-width="1.5" rx="6"/>
  <text x="76" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">Factory</text>
  <text x="76" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">Default</text>
  <text x="76" y="120" text-anchor="middle" font-size="8" fill="#f97316">ACS URL</text>
  <text x="76" y="131" text-anchor="middle" font-size="8" fill="#f97316">pre-provisioned</text>

  <line x1="134" y1="100" x2="152" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 2: Subscriber plugs in -->
  <rect x="154" y="60" width="116" height="80" fill="#150a00" stroke="#f97316" stroke-width="1.5" rx="6"/>
  <text x="212" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">Plugged In</text>
  <text x="212" y="106" text-anchor="middle" font-size="8" fill="#f97316">Subscriber powers</text>
  <text x="212" y="117" text-anchor="middle" font-size="8" fill="#f97316">on the device</text>

  <line x1="270" y1="100" x2="288" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 3: DHCP -->
  <rect x="290" y="60" width="116" height="80" fill="#150a00" stroke="#f97316" stroke-width="1.5" rx="6"/>
  <text x="348" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">DHCP</text>
  <text x="348" y="106" text-anchor="middle" font-size="8" fill="#f97316">WAN IP assigned</text>
  <text x="348" y="117" text-anchor="middle" font-size="8" fill="#f97316">(option 43 optional)</text>

  <line x1="406" y1="100" x2="424" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 4: Bootstrap Inform -->
  <rect x="426" y="60" width="116" height="80" fill="#041008" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="484" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#86efac">Inform:</text>
  <text x="484" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#86efac">BOOTSTRAP</text>
  <text x="484" y="120" text-anchor="middle" font-size="8" fill="#34d399">No prior state &#8212;</text>
  <text x="484" y="131" text-anchor="middle" font-size="8" fill="#34d399">new activation</text>

  <line x1="542" y1="100" x2="560" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 5: ACS provisions -->
  <rect x="562" y="60" width="116" height="80" fill="#041008" stroke="#34d399" stroke-width="1.5" rx="6"/>
  <text x="620" y="86" text-anchor="middle" font-size="10" font-weight="700" fill="#86efac">ACS</text>
  <text x="620" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#86efac">Provisions</text>
  <text x="620" y="120" text-anchor="middle" font-size="8" fill="#34d399">SSID, VLAN,</text>
  <text x="620" y="131" text-anchor="middle" font-size="8" fill="#34d399">service profile</text>

  <line x1="678" y1="100" x2="696" y2="100" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Footer final banner -->
  <rect x="270" y="165" width="220" height="40" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="380" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#bae6fd">Fully Configured</text>
  <text x="380" y="198" text-anchor="middle" font-size="9" fill="#38bdf8" opacity="0.8">no technician visit required</text>

  <path d="M 620,140 C 620,175 500,175 490,175" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-muted)"/>
</svg>
