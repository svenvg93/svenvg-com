<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="g1" x1="108" y1="95" x2="592" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="g2" x1="592" y1="130" x2="108" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="g3" x1="592" y1="195" x2="108" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="g4" x1="108" y1="230" x2="592" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="g5" x1="592" y1="278" x2="108" y2="278" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#34d399"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="url(#bg)" rx="8"/>

  <!-- CPE (green zone) -->
  <rect x="40" y="25" width="120" height="44" fill="none" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="100" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#86efac">CPE</text>

  <!-- ACS (red zone) -->
  <rect x="540" y="25" width="120" height="44" fill="none" stroke="#ef4444" stroke-width="1.5" rx="5"/>
  <text x="600" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#fca5a5">ACS</text>

  <!-- Lifelines -->
  <line x1="100" y1="69" x2="100" y2="292" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="600" y1="69" x2="600" y2="292" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Step 1: Inform (CPE -> ACS) -->
  <line x1="108" y1="95" x2="592" y2="95" stroke="url(#g1)" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="350" y="87" text-anchor="middle" font-size="9" fill="#86efac">1 &#183; Inform (identity + event codes)</text>

  <!-- Step 2: InformResponse (ACS -> CPE) -->
  <line x1="592" y1="130" x2="108" y2="130" stroke="url(#g2)" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="350" y="122" text-anchor="middle" font-size="9" fill="#fca5a5">2 &#183; InformResponse</text>

  <!-- Loop bracket for RPC exchange -->
  <rect x="130" y="148" width="440" height="105" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" rx="4"/>
  <text x="350" y="163" text-anchor="middle" font-size="8" fill="#38bdf8" opacity="0.85">repeats 0..N times</text>

  <!-- Step 3: RPC (ACS -> CPE) -->
  <line x1="592" y1="195" x2="108" y2="195" stroke="url(#g3)" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="350" y="187" text-anchor="middle" font-size="9" fill="#fca5a5">3 &#183; RPC call (e.g. SetParameterValues, Download, Reboot)</text>

  <!-- Step 4: RPC response (CPE -> ACS) -->
  <line x1="108" y1="230" x2="592" y2="230" stroke="url(#g4)" stroke-width="1.2" marker-end="url(#arr-red)" opacity="0.85"/>
  <text x="350" y="222" text-anchor="middle" font-size="9" fill="#86efac" opacity="0.9">4 &#183; RPC response</text>

  <!-- Step 5: Empty envelope (ACS -> CPE) -->
  <line x1="592" y1="278" x2="108" y2="278" stroke="url(#g5)" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="350" y="270" text-anchor="middle" font-size="9" fill="#fca5a5">5 &#183; Empty HTTP response &#8212; nothing more to send</text>

  <!-- Final state -->
  <rect x="250" y="295" width="200" height="55" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="350" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#bae6fd">Session closed</text>
  <text x="350" y="335" text-anchor="middle" font-size="9" fill="#38bdf8" opacity="0.8">CPE ends the connection</text>
</svg>
