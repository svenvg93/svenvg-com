<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <rect width="700" height="260" fill="url(#bg)" rx="8"/>

  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">DOWNLOADDIAGNOSTICS TIMELINE</text>

  <!-- Axis -->
  <line x1="50" y1="140" x2="650" y2="140" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Point 1: ROMTime -->
  <circle cx="90" cy="140" r="3.5" fill="#38bdf8"/>
  <line x1="90" y1="140" x2="90" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="90" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#bae6fd">ROMTime</text>

  <!-- Point 2: TCPOpenRequestTime -->
  <circle cx="210" cy="140" r="3.5" fill="#38bdf8"/>
  <line x1="210" y1="140" x2="210" y2="108" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="210" y="100" text-anchor="middle" font-size="9" font-weight="600" fill="#bae6fd">TCPOpenRequestTime</text>

  <!-- Point 3: TCPOpenResponseTime -->
  <circle cx="320" cy="140" r="3.5" fill="#38bdf8"/>
  <line x1="320" y1="140" x2="320" y2="70" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="320" y="60" text-anchor="middle" font-size="9" font-weight="600" fill="#bae6fd">TCPOpenResponseTime</text>

  <!-- Point 4: BOMTime -->
  <circle cx="440" cy="140" r="3.5" fill="#34d399"/>
  <line x1="440" y1="140" x2="440" y2="108" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="440" y="100" text-anchor="middle" font-size="9" font-weight="700" fill="#86efac">BOMTime</text>

  <!-- Point 5: EOMTime -->
  <circle cx="610" cy="140" r="3.5" fill="#34d399"/>
  <line x1="610" y1="140" x2="610" y2="70" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
  <text x="610" y="60" text-anchor="middle" font-size="9" font-weight="700" fill="#86efac">EOMTime</text>

  <!-- Bracket A: setup overhead -->
  <line x1="90" y1="168" x2="440" y2="168" stroke="#f97316" stroke-width="1.5"/>
  <line x1="90" y1="163" x2="90" y2="173" stroke="#f97316" stroke-width="1.5"/>
  <line x1="440" y1="163" x2="440" y2="173" stroke="#f97316" stroke-width="1.5"/>
  <text x="265" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">Setup overhead (excluded)</text>
  <text x="265" y="201" text-anchor="middle" font-size="8" fill="#f97316">DNS resolution + TCP handshake</text>

  <!-- Bracket B: transfer window -->
  <line x1="440" y1="168" x2="610" y2="168" stroke="#34d399" stroke-width="1.5"/>
  <line x1="440" y1="163" x2="440" y2="173" stroke="#34d399" stroke-width="1.5"/>
  <line x1="610" y1="163" x2="610" y2="173" stroke="#34d399" stroke-width="1.5"/>
  <text x="525" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Transfer window (measured)</text>
  <text x="525" y="201" text-anchor="middle" font-size="8" fill="#34d399">TestBytesReceived &#247; duration = throughput</text>

  <text x="350" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">Throughput is calculated only across BOMTime&#8211;EOMTime &#8212; DNS and TCP setup time is excluded</text>
</svg>
