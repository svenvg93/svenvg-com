<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <rect width="700" height="300" fill="url(#bg)" rx="8"/>

  <line x1="0" y1="36" x2="700" y2="36" stroke="#0d1a2a" stroke-width="1"/>
  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">TWO CONTROLLERS, ONE AGENT, DISJOINT ROLES</text>

  <!-- === Left column: ISP Controller === -->
  <rect x="40" y="36" width="290" height="230" fill="#0a1420" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
  <text x="185" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#38bdf8">ISP Controller</text>
  <text x="185" y="70" text-anchor="middle" font-size="10" fill="#7dd3fc">Role: &quot;ISP-Admin&quot;</text>

  <rect x="56" y="82" width="258" height="36" fill="#08101c" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="70" y="102" font-size="10" font-weight="600" fill="#bae6fd">Device.WAN.*</text>
  <text x="300" y="102" text-anchor="end" font-size="11" font-weight="700" fill="#7dd3fc">rwxn</text>

  <rect x="56" y="124" width="258" height="36" fill="#08101c" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="70" y="144" font-size="10" font-weight="600" fill="#bae6fd">Device.WiFi.*</text>
  <text x="300" y="144" text-anchor="end" font-size="11" font-weight="700" fill="#7dd3fc">r--n</text>

  <rect x="56" y="166" width="258" height="36" fill="#08101c" stroke="#38bdf8" stroke-width="1" rx="4"/>
  <text x="70" y="186" font-size="10" font-weight="600" fill="#bae6fd">Device.LocalAgent.*</text>
  <text x="300" y="186" text-anchor="end" font-size="11" font-weight="700" fill="#7dd3fc">r---</text>

  <rect x="56" y="208" width="258" height="40" fill="#0a1420" stroke="#0369a1" stroke-width="1" rx="4"/>
  <text x="185" y="224" text-anchor="middle" font-size="10" font-weight="600" fill="#bae6fd">Full control over WAN,</text>
  <text x="185" y="238" text-anchor="middle" font-size="9" fill="#38bdf8">read-only visibility elsewhere</text>

  <!-- === Right column: Smart-Home Controller === -->
  <rect x="370" y="36" width="290" height="230" fill="#041008" stroke="#34d399" stroke-width="1.5" rx="8"/>
  <text x="515" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">Smart-Home Controller</text>
  <text x="515" y="70" text-anchor="middle" font-size="10" fill="#86efac">Role: &quot;Home-App&quot;</text>

  <rect x="386" y="82" width="258" height="36" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="400" y="102" font-size="10" font-weight="600" fill="#86efac">Device.WAN.*</text>
  <text x="630" y="102" text-anchor="end" font-size="11" font-weight="700" fill="#6ee7b7">----</text>

  <rect x="386" y="124" width="258" height="36" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="400" y="144" font-size="10" font-weight="600" fill="#86efac">Device.WiFi.*</text>
  <text x="630" y="144" text-anchor="end" font-size="11" font-weight="700" fill="#6ee7b7">rwxn</text>

  <rect x="386" y="166" width="258" height="36" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="400" y="186" font-size="10" font-weight="600" fill="#86efac">Device.LocalAgent.*</text>
  <text x="630" y="186" text-anchor="end" font-size="11" font-weight="700" fill="#6ee7b7">----</text>

  <rect x="386" y="208" width="258" height="40" fill="#041a10" stroke="#166534" stroke-width="1" rx="4"/>
  <text x="515" y="224" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Full control over WiFi/IoT,</text>
  <text x="515" y="238" text-anchor="middle" font-size="9" fill="#34d399">no access to WAN at all</text>

  <text x="350" y="286" text-anchor="middle" font-size="9" fill="#94a3b8">Neither Controller can reach into the other's scope &#8212; enforced by the Agent, not either Controller's behavior</text>
</svg>
