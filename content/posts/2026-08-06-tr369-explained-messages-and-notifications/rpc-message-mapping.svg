<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <rect width="700" height="360" fill="url(#bg)" rx="8"/>

  <text x="140" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#f97316" letter-spacing="1">CWMP RPCs</text>
  <text x="570" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399" letter-spacing="1">USP MESSAGES</text>

  <!-- Left boxes: CWMP RPCs -->
  <rect x="20" y="34" width="240" height="26" fill="#150a00" stroke="#f97316" stroke-width="1.2" rx="4"/>
  <text x="140" y="51" text-anchor="middle" font-size="10" fill="#fdba74">GetParameterValues</text>

  <rect x="20" y="66" width="240" height="26" fill="#150a00" stroke="#f97316" stroke-width="1.2" rx="4"/>
  <text x="140" y="83" text-anchor="middle" font-size="10" fill="#fdba74">GetParameterNames</text>

  <rect x="20" y="98" width="240" height="26" fill="#150a00" stroke="#f97316" stroke-width="1.2" rx="4"/>
  <text x="140" y="115" text-anchor="middle" font-size="10" fill="#fdba74">SetParameterValues</text>

  <rect x="20" y="130" width="240" height="26" fill="#150a00" stroke="#f97316" stroke-width="1.2" rx="4"/>
  <text x="140" y="147" text-anchor="middle" font-size="10" fill="#fdba74">AddObject</text>

  <rect x="20" y="162" width="240" height="26" fill="#150a00" stroke="#f97316" stroke-width="1.2" rx="4"/>
  <text x="140" y="179" text-anchor="middle" font-size="10" fill="#fdba74">DeleteObject</text>

  <rect x="20" y="194" width="240" height="26" fill="#150808" stroke="#7c2d12" stroke-width="1.2" rx="4"/>
  <text x="140" y="211" text-anchor="middle" font-size="10" fill="#fdba74">Reboot</text>

  <rect x="20" y="226" width="240" height="26" fill="#150808" stroke="#7c2d12" stroke-width="1.2" rx="4"/>
  <text x="140" y="243" text-anchor="middle" font-size="10" fill="#fdba74">FactoryReset</text>

  <rect x="20" y="258" width="240" height="26" fill="#150808" stroke="#7c2d12" stroke-width="1.2" rx="4"/>
  <text x="140" y="275" text-anchor="middle" font-size="10" fill="#fdba74">Download</text>

  <rect x="20" y="290" width="240" height="26" fill="#150808" stroke="#7c2d12" stroke-width="1.2" rx="4"/>
  <text x="140" y="307" text-anchor="middle" font-size="10" fill="#fdba74">Upload</text>

  <!-- Right boxes: USP messages -->
  <rect x="480" y="48" width="180" height="30" fill="#031006" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="570" y="67" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Get</text>

  <rect x="480" y="96" width="180" height="30" fill="#031006" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="570" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Set</text>

  <rect x="480" y="128" width="180" height="30" fill="#031006" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="570" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Add</text>

  <rect x="480" y="160" width="180" height="30" fill="#031006" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="570" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Delete</text>

  <rect x="480" y="240" width="180" height="30" fill="#041a10" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="570" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Operate</text>

  <!-- Connecting lines -->
  <line x1="260" y1="47" x2="480" y2="63" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="79" x2="480" y2="63" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <line x1="260" y1="111" x2="480" y2="111" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="143" x2="480" y2="143" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="175" x2="480" y2="175" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <line x1="260" y1="207" x2="480" y2="255" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="239" x2="480" y2="255" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="271" x2="480" y2="255" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="260" y1="303" x2="480" y2="255" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <text x="350" y="340" text-anchor="middle" font-size="9" fill="#94a3b8">Four independent one-off RPCs collapse into a single Operate message against a command path</text>
</svg>
