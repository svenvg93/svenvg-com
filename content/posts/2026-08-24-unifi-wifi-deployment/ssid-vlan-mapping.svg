<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>

    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#166534"/>
    </marker>
    <marker id="arr-indigo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#6366f1"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#92400e"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="url(#bg)" rx="8"/>

  <line x1="0" y1="36" x2="700" y2="36" stroke="#0d1a2a" stroke-width="1"/>
  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SSID &#8594; NETWORK &#8594; ZONE BINDING</text>

  <text x="350" y="52" text-anchor="middle" font-size="9" fill="#94a3b8">Each WiFi network binds to one VLAN, and inherits that network's zone &#8212; not the other way around</text>

  <!-- ================= Lane 1: Trusted SSID -> Trusted -> Internal (green) ================= -->
  <rect x="30" y="66" width="170" height="40" fill="#071810" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="115" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">Trusted SSID</text>
  <text x="115" y="96" text-anchor="middle" font-size="9" fill="#4ade80">WiFi network</text>

  <line x1="115" y1="106" x2="115" y2="135" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="30" y="136" width="170" height="40" fill="#071810" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="115" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">Trusted</text>
  <text x="115" y="166" text-anchor="middle" font-size="9" fill="#4ade80" font-family="'Courier New',monospace">192.168.1.0/24</text>

  <line x1="115" y1="176" x2="115" y2="205" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="30" y="206" width="170" height="40" fill="#071810" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="115" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">Internal</text>
  <text x="115" y="236" text-anchor="middle" font-size="9" fill="#4ade80">default zone</text>

  <!-- ================= Lane 2: IoT SSID -> IoT -> Custom (IoT) (indigo, custom zone) ================= -->
  <rect x="265" y="66" width="170" height="40" fill="#0a0d28" stroke="#6366f1" stroke-width="1.5" rx="5"/>
  <text x="350" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#a5b4fc">IoT SSID</text>
  <text x="350" y="96" text-anchor="middle" font-size="9" fill="#818cf8">WiFi network</text>

  <line x1="350" y1="106" x2="350" y2="135" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr-indigo)"/>

  <rect x="265" y="136" width="170" height="40" fill="#0a0d28" stroke="#6366f1" stroke-width="1.5" rx="5"/>
  <text x="350" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#a5b4fc">IoT</text>
  <text x="350" y="166" text-anchor="middle" font-size="9" fill="#818cf8" font-family="'Courier New',monospace">192.168.10.0/24</text>

  <line x1="350" y1="176" x2="350" y2="205" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr-indigo)"/>

  <rect x="265" y="206" width="170" height="40" fill="#0a0d28" stroke="#6366f1" stroke-width="1.5" rx="5"/>
  <text x="350" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#a5b4fc">Custom (IoT)</text>
  <text x="350" y="236" text-anchor="middle" font-size="9" fill="#818cf8">custom zone</text>

  <!-- ================= Lane 3: Guest SSID -> Guest -> Hotspot (amber) ================= -->
  <rect x="500" y="66" width="170" height="40" fill="#1a1000" stroke="#92400e" stroke-width="1.5" rx="5"/>
  <text x="585" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#fcd34d">Guest SSID</text>
  <text x="585" y="96" text-anchor="middle" font-size="9" fill="#fbbf24">WiFi network</text>

  <line x1="585" y1="106" x2="585" y2="135" stroke="#92400e" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="500" y="136" width="170" height="40" fill="#1a1000" stroke="#92400e" stroke-width="1.5" rx="5"/>
  <text x="585" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#fcd34d">Guest</text>
  <text x="585" y="166" text-anchor="middle" font-size="9" fill="#fbbf24" font-family="'Courier New',monospace">192.168.30.0/24</text>

  <line x1="585" y1="176" x2="585" y2="205" stroke="#92400e" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <rect x="500" y="206" width="170" height="40" fill="#1a1000" stroke="#92400e" stroke-width="1.5" rx="5"/>
  <text x="585" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#fcd34d">Hotspot</text>
  <text x="585" y="236" text-anchor="middle" font-size="9" fill="#fbbf24">default zone (guest)</text>

  <text x="350" y="278" text-anchor="middle" font-size="9" fill="#94a3b8">Firewall behavior comes from the zone, inherited via the network &#8212; nothing is configured per SSID</text>
</svg>
