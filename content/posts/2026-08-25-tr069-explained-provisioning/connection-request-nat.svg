<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <rect width="700" height="300" fill="url(#bg)" rx="8"/>

  <line x1="0" y1="36" x2="700" y2="36" stroke="#0d1a2a" stroke-width="1"/>
  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">CONNECTION REQUEST &#8212; DIRECT VS STUN-MEDIATED</text>

  <!-- === Left column: Direct === -->
  <rect x="40" y="36" width="290" height="230" fill="#041008" stroke="#34d399" stroke-width="1.5" rx="8"/>
  <text x="185" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">Directly Reachable</text>
  <text x="185" y="70" text-anchor="middle" font-size="10" fill="#86efac">(no CGNAT on the WAN)</text>

  <rect x="56" y="80" width="258" height="34" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="185" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">ACS sends HTTP GET</text>
  <text x="185" y="108" text-anchor="middle" font-size="9" fill="#34d399">to the CPE's Connection Request URL</text>

  <text x="185" y="128" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="56" y="134" width="258" height="34" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="185" y="150" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">CPE receives the GET</text>
  <text x="185" y="162" text-anchor="middle" font-size="9" fill="#34d399">on its WAN-side listener</text>

  <text x="185" y="182" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="56" y="188" width="258" height="42" fill="#041a10" stroke="#166534" stroke-width="1" rx="4"/>
  <text x="185" y="206" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">CPE opens a session</text>
  <text x="185" y="220" text-anchor="middle" font-size="9" fill="#34d399">Inform: 6 CONNECTION REQUEST</text>

  <!-- === Right column: STUN === -->
  <rect x="370" y="36" width="290" height="230" fill="#1a0a00" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="515" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#f97316">Behind CGNAT</text>
  <text x="515" y="70" text-anchor="middle" font-size="10" fill="#fb923c">(no stable inbound path)</text>

  <rect x="386" y="80" width="258" height="34" fill="#150a00" stroke="#f97316" stroke-width="1" rx="4"/>
  <text x="515" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">CPE keeps a UDP binding</text>
  <text x="515" y="108" text-anchor="middle" font-size="9" fill="#f97316">open to a STUN server</text>

  <text x="515" y="128" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="386" y="134" width="258" height="34" fill="#150a00" stroke="#f97316" stroke-width="1" rx="4"/>
  <text x="515" y="150" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">ACS queries STUN server</text>
  <text x="515" y="162" text-anchor="middle" font-size="9" fill="#f97316">learns the CPE's NAT-mapped address</text>

  <text x="515" y="182" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="386" y="188" width="258" height="42" fill="#1a0a00" stroke="#7c2d12" stroke-width="1" rx="4"/>
  <text x="515" y="206" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">ACS sends UDP notification</text>
  <text x="515" y="220" text-anchor="middle" font-size="9" fill="#f97316">to that mapping &#8594; CPE opens a session</text>

  <text x="350" y="286" text-anchor="middle" font-size="9" fill="#94a3b8">Same NAT-traversal problem VoIP has always had, solved the same way</text>
</svg>
