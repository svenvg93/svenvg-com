<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#38bdf8"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="700" height="310" fill="url(#bg)" rx="8"/>

  <!-- Device root (blue) -->
  <rect x="20" y="120" width="120" height="70" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="80" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#bae6fd">Device.</text>
  <text x="80" y="168" text-anchor="middle" font-size="9" fill="#38bdf8" opacity="0.8">root</text>

  <text x="80" y="210" text-anchor="middle" font-size="8" fill="#94a3b8">(siblings: DeviceInfo,</text>
  <text x="80" y="222" text-anchor="middle" font-size="8" fill="#94a3b8">IP, ManagementServer&#8230;)</text>

  <line x1="140" y1="155" x2="273" y2="155" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- WiFi (green, multi-instance parent) -->
  <rect x="280" y="100" width="130" height="110" fill="none" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="345" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#86efac">WiFi</text>
  <text x="345" y="166" text-anchor="middle" font-size="9" fill="#34d399" opacity="0.8">multi-instance parent</text>

  <line x1="410" y1="155" x2="543" y2="76" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="410" y1="155" x2="543" y2="154.5" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="410" y1="155" x2="543" y2="233" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- SSID.1 -->
  <rect x="550" y="45" width="130" height="55" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#fdba74">SSID.1</text>
  <text x="615" y="83" text-anchor="middle" font-size="8" fill="#f97316" opacity="0.85">SSID = MyHomeNetwork</text>

  <!-- SSID.2 -->
  <rect x="550" y="127" width="130" height="55" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#fdba74">SSID.2</text>
  <text x="615" y="165" text-anchor="middle" font-size="8" fill="#f97316" opacity="0.85">SSID = MyHomeNetwork-Guest</text>

  <!-- SSID.3 -->
  <rect x="550" y="209" width="130" height="55" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#fdba74">SSID.3</text>
  <text x="615" y="247" text-anchor="middle" font-size="8" fill="#f97316" opacity="0.85">instance 3 of 3 configured</text>

  <text x="345" y="270" text-anchor="middle" font-size="9" fill="#94a3b8">Instance numbers exist because WiFi.SSID is multi-instance &#8212;</text>
  <text x="345" y="284" text-anchor="middle" font-size="9" fill="#94a3b8">GetParameterNames discovers which instances exist without hardcoding them</text>
</svg>
