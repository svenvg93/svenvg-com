<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <rect width="700" height="300" fill="url(#bg)" rx="8"/>

  <line x1="0" y1="36" x2="700" y2="36" stroke="#0d1a2a" stroke-width="1"/>
  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">TR-098 VS TR-181 &#8212; TWO GENERATIONS OF DATA MODEL</text>

  <!-- === Left column: TR-098 === -->
  <rect x="40" y="36" width="290" height="230" fill="#1a0a00" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="185" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#f97316">TR-098 (Legacy)</text>
  <text x="185" y="70" text-anchor="middle" font-size="10" fill="#fb923c">root: InternetGatewayDevice.</text>

  <rect x="56" y="80" width="258" height="34" fill="#150a00" stroke="#f97316" stroke-width="1" rx="4"/>
  <text x="185" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">Router-only scope</text>
  <text x="185" y="108" text-anchor="middle" font-size="9" fill="#f97316">Designed specifically for NAT gateways</text>

  <text x="185" y="128" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="56" y="134" width="258" height="46" fill="#150a00" stroke="#f97316" stroke-width="1" rx="4"/>
  <text x="185" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#fdba74">Path example</text>
  <text x="185" y="160" text-anchor="middle" font-size="8" fill="#f97316">InternetGatewayDevice.LANDevice.1.</text>
  <text x="185" y="171" text-anchor="middle" font-size="8" fill="#f97316">WLANConfiguration.1.SSID</text>

  <text x="185" y="200" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="56" y="206" width="258" height="34" fill="#150808" stroke="#7c2d12" stroke-width="1" rx="4"/>
  <text x="185" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">Still widely deployed</text>
  <text x="185" y="234" text-anchor="middle" font-size="9" fill="#f97316">Common on older, already-fielded CPE</text>

  <!-- === Right column: TR-181 === -->
  <rect x="370" y="36" width="290" height="230" fill="#041008" stroke="#34d399" stroke-width="1.5" rx="8"/>
  <text x="515" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">TR-181 (Current)</text>
  <text x="515" y="70" text-anchor="middle" font-size="10" fill="#86efac">root: Device.</text>

  <rect x="386" y="80" width="258" height="34" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="96" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Any managed device</text>
  <text x="515" y="108" text-anchor="middle" font-size="9" fill="#34d399">Router, ONT, mesh node, standalone AP</text>

  <text x="515" y="128" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="386" y="134" width="258" height="46" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">Path example</text>
  <text x="515" y="165" text-anchor="middle" font-size="8" fill="#34d399">Device.WiFi.SSID.1.SSID</text>

  <text x="515" y="200" text-anchor="middle" font-size="14" fill="#94a3b8">&#x2193;</text>

  <rect x="386" y="206" width="258" height="34" fill="#041a10" stroke="#166534" stroke-width="1" rx="4"/>
  <text x="515" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#86efac">Required for new deployments</text>
  <text x="515" y="234" text-anchor="middle" font-size="9" fill="#34d399">Aligned with TR-369/USP's unified model</text>

  <text x="350" y="286" text-anchor="middle" font-size="9" fill="#94a3b8">A CPE implements one root or the other &#8212; the ACS must know which before sending a single RPC</text>
</svg>
