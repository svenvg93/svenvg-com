<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-muted" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 7,3 0,6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="780" height="230" fill="url(#bg)" rx="8"/>

  <text x="390" y="24" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">DNS-SD CONTROLLER LOOKUP</text>

  <!-- Step 1: PTR -->
  <rect x="20" y="60" width="170" height="90" fill="#0a1420" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="105" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">PTR Record</text>
  <text x="105" y="106" text-anchor="middle" font-size="8" fill="#38bdf8">Find instances of</text>
  <text x="105" y="118" text-anchor="middle" font-size="8" fill="#38bdf8">usp-ctr-mqtt._tcp</text>
  <text x="105" y="132" text-anchor="middle" font-size="8" fill="#38bdf8">in the domain</text>

  <line x1="190" y1="105" x2="208" y2="105" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 2: SRV -->
  <rect x="210" y="60" width="170" height="90" fill="#0a1420" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="295" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">SRV Record</text>
  <text x="295" y="106" text-anchor="middle" font-size="8" fill="#38bdf8">Resolves the instance</text>
  <text x="295" y="118" text-anchor="middle" font-size="8" fill="#38bdf8">to a host and port</text>

  <line x1="380" y1="105" x2="398" y2="105" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 3: TXT -->
  <rect x="400" y="60" width="170" height="90" fill="#0a1420" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="485" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">TXT Record</text>
  <text x="485" y="106" text-anchor="middle" font-size="8" fill="#38bdf8">Resource path,</text>
  <text x="485" y="118" text-anchor="middle" font-size="8" fill="#38bdf8">optional encrypt flag</text>

  <line x1="570" y1="105" x2="588" y2="105" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-muted)"/>

  <!-- Step 4: A/AAAA -->
  <rect x="590" y="60" width="170" height="90" fill="#0a1420" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="675" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#bae6fd">A / AAAA Record</text>
  <text x="675" y="106" text-anchor="middle" font-size="8" fill="#38bdf8">Resolves the host</text>
  <text x="675" y="118" text-anchor="middle" font-size="8" fill="#38bdf8">to an IP address</text>

  <!-- Final banner -->
  <rect x="290" y="180" width="200" height="40" fill="none" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="390" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#86efac">Connect to Controller</text>
  <text x="390" y="213" text-anchor="middle" font-size="8" fill="#34d399" opacity="0.85">using the resolved MTP endpoint</text>

  <path d="M 675,150 C 675,190 500,190 492,197" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-muted)"/>
</svg>
