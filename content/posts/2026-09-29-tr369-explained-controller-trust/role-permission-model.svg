<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#38bdf8"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="700" height="330" fill="url(#bg)" rx="8"/>

  <!-- Controller (green) -->
  <rect x="20" y="125" width="120" height="60" fill="none" stroke="#34d399" stroke-width="1.5" rx="5"/>
  <text x="80" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#86efac">Controller</text>
  <text x="80" y="169" text-anchor="middle" font-size="9" fill="#34d399" opacity="0.8">assigned one Role</text>

  <line x1="140" y1="155" x2="273" y2="155" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Role (blue) -->
  <rect x="280" y="100" width="130" height="110" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="345" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#bae6fd">Role</text>
  <text x="345" y="168" text-anchor="middle" font-size="9" fill="#38bdf8" opacity="0.8">e.g. &quot;ISP-Admin&quot;</text>

  <line x1="410" y1="155" x2="543" y2="45" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <line x1="410" y1="155" x2="543" y2="110" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <line x1="410" y1="155" x2="543" y2="175" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <line x1="410" y1="155" x2="543" y2="240" stroke="#f97316" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Permission targets (orange) -->
  <rect x="550" y="20" width="130" height="50" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#fdba74">Param</text>
  <text x="615" y="55" text-anchor="middle" font-size="8" fill="#f97316">rwxn per parameter</text>

  <rect x="550" y="85" width="130" height="50" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#fdba74">Obj</text>
  <text x="615" y="120" text-anchor="middle" font-size="8" fill="#f97316">x = can Add instances</text>

  <rect x="550" y="150" width="130" height="50" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">InstantiatedObj</text>
  <text x="615" y="185" text-anchor="middle" font-size="8" fill="#f97316">x = can Delete instance</text>

  <rect x="550" y="215" width="130" height="50" fill="none" stroke="#f97316" stroke-width="1.5" rx="5"/>
  <text x="615" y="233" text-anchor="middle" font-size="10" font-weight="700" fill="#fdba74">CommandEvent</text>
  <text x="615" y="250" text-anchor="middle" font-size="8" fill="#f97316">x = can Operate/subscribe</text>

  <text x="345" y="290" text-anchor="middle" font-size="9" fill="#94a3b8">Every incoming message is checked against the Role's Permission entries</text>
  <text x="345" y="304" text-anchor="middle" font-size="9" fill="#94a3b8">before the Agent applies it</text>
</svg>
