<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
  </defs>

  <rect width="700" height="300" fill="url(#bg)" rx="8"/>

  <line x1="0" y1="36" x2="700" y2="36" stroke="#0d1a2a" stroke-width="1"/>
  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">ONE NOTIFICATION CONCEPT VS SIX</text>

  <!-- === Left column: CWMP === -->
  <rect x="40" y="36" width="290" height="230" fill="#1a0a00" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="185" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#f97316">CWMP</text>
  <text x="185" y="70" text-anchor="middle" font-size="10" fill="#fb923c">one notification concept</text>

  <rect x="56" y="82" width="258" height="76" fill="#150a00" stroke="#f97316" stroke-width="1" rx="4"/>
  <text x="185" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">A parameter's value changed</text>
  <text x="185" y="120" text-anchor="middle" font-size="9" fill="#f97316">Passive: rides the next Inform</text>
  <text x="185" y="134" text-anchor="middle" font-size="9" fill="#f97316">Active: immediate session,</text>
  <text x="185" y="148" text-anchor="middle" font-size="9" fill="#f97316">event 4 VALUE CHANGE</text>

  <rect x="56" y="170" width="258" height="80" fill="#150808" stroke="#7c2d12" stroke-width="1" rx="4"/>
  <text x="185" y="190" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">No general lifecycle or</text>
  <text x="185" y="204" text-anchor="middle" font-size="10" font-weight="600" fill="#fdba74">command-completion signal</text>
  <text x="185" y="222" text-anchor="middle" font-size="9" fill="#f97316">Special-cased Inform event codes</text>
  <text x="185" y="236" text-anchor="middle" font-size="9" fill="#f97316">bolted on instead (7, 8)</text>

  <!-- === Right column: USP === -->
  <rect x="370" y="36" width="290" height="230" fill="#041008" stroke="#34d399" stroke-width="1.5" rx="8"/>
  <text x="515" y="56" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">USP</text>
  <text x="515" y="70" text-anchor="middle" font-size="10" fill="#86efac">six NotifType values</text>

  <rect x="386" y="82" width="258" height="26" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="99" text-anchor="middle" font-size="10" fill="#86efac">ValueChange</text>

  <rect x="386" y="112" width="258" height="26" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="129" text-anchor="middle" font-size="10" fill="#86efac">ObjectCreation</text>

  <rect x="386" y="142" width="258" height="26" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="159" text-anchor="middle" font-size="10" fill="#86efac">ObjectDeletion</text>

  <rect x="386" y="172" width="258" height="26" fill="#041a10" stroke="#166534" stroke-width="1" rx="4"/>
  <text x="515" y="189" text-anchor="middle" font-size="10" fill="#86efac">OperationComplete</text>

  <rect x="386" y="202" width="258" height="26" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="219" text-anchor="middle" font-size="10" fill="#86efac">Event</text>

  <rect x="386" y="232" width="258" height="26" fill="#031006" stroke="#34d399" stroke-width="1" rx="4"/>
  <text x="515" y="249" text-anchor="middle" font-size="10" fill="#86efac">OnBoardRequest</text>

  <text x="350" y="286" text-anchor="middle" font-size="9" fill="#94a3b8">One Notify message carries whichever type fired &#8212; the Subscription's NotifType picks which</text>
</svg>
