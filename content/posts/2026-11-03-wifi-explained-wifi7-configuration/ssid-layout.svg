<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300"
     font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#4ade80"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0 8,3 0,6" fill="#fcd34d"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="url(#bg)" rx="8"/>

  <line x1="0" y1="36" x2="700" y2="36" stroke="#0d1a2a" stroke-width="1"/>
  <text x="350" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SSID LAYOUT — TWO NETWORKS ON THREE RADIOS</text>

  <!-- Access point -->
  <rect x="30" y="48" width="140" height="214" fill="#0e1a3a" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
  <text x="100" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#93c5fd">WiFi 7 AP</text>

  <rect x="40" y="82" width="120" height="34" fill="#0b1628" stroke="#1e3a5f" stroke-width="1.5" rx="5"/>
  <text x="100" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#93c5fd">6 GHz</text>
  <rect x="40" y="122" width="120" height="34" fill="#0b1628" stroke="#1e3a5f" stroke-width="1.5" rx="5"/>
  <text x="100" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#93c5fd">5 GHz</text>
  <rect x="40" y="201" width="120" height="34" fill="#0b1628" stroke="#1e3a5f" stroke-width="1.5" rx="5"/>
  <text x="100" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#93c5fd">2.4 GHz</text>

  <!-- Main network -->
  <rect x="210" y="48" width="240" height="112" fill="#071810" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="330" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">Main network</text>
  <text x="330" y="88" text-anchor="middle" font-size="9" fill="#94a3b8">5 + 6 GHz</text>
  <text x="330" y="104" text-anchor="middle" font-size="9" fill="#94a3b8">WPA3 — SAE + SAE-EXT-KEY</text>
  <text x="330" y="120" text-anchor="middle" font-size="9" fill="#94a3b8">PMF required</text>
  <text x="330" y="136" text-anchor="middle" font-size="9" fill="#94a3b8">MLO on</text>

  <!-- IoT / legacy network -->
  <rect x="210" y="184" width="240" height="78" fill="#1a1000" stroke="#92400e" stroke-width="1.5" rx="5"/>
  <text x="330" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#fcd34d">IoT / legacy network</text>
  <text x="330" y="222" text-anchor="middle" font-size="9" fill="#94a3b8">2.4 GHz — WPA2/WPA3 transition or WPA2</text>
  <text x="330" y="238" text-anchor="middle" font-size="9" fill="#94a3b8">PMF optional · no MLO</text>

  <!-- Radio to network arrows -->
  <line x1="160" y1="99"  x2="209" y2="99"  stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="160" y1="139" x2="209" y2="139" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="160" y1="218" x2="209" y2="218" stroke="#fcd34d" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Optional 2.4 GHz link to the main network -->
  <path d="M160,208 H190 V150 H209" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="330" y="177" text-anchor="middle" font-size="9" fill="#4ade80">only if 5 GHz doesn't cover everywhere</text>

  <!-- Main clients -->
  <rect x="490" y="48" width="180" height="112" fill="#071810" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="580" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">Main clients</text>
  <text x="580" y="84" text-anchor="middle" font-size="9" fill="#94a3b8">phones, laptops, tablets</text>
  <rect x="500" y="96" width="160" height="54" fill="#0b1628" stroke="#166534" stroke-width="1.5" rx="5"/>
  <text x="580" y="111" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">WiFi 7 client — MLO links</text>
  <rect x="510" y="119" width="68" height="23" fill="#071810" stroke="#4ade80" stroke-width="1" rx="3"/>
  <text x="544" y="134" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">5 GHz</text>
  <rect x="582" y="119" width="68" height="23" fill="#071810" stroke="#4ade80" stroke-width="1" rx="3"/>
  <text x="616" y="134" text-anchor="middle" font-size="9" font-weight="600" fill="#86efac">6 GHz</text>

  <!-- IoT clients -->
  <rect x="490" y="184" width="180" height="78" fill="#1a1000" stroke="#92400e" stroke-width="1.5" rx="5"/>
  <text x="580" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#fcd34d">IoT / legacy clients</text>
  <text x="580" y="222" text-anchor="middle" font-size="9" fill="#94a3b8">smart plugs, printers,</text>
  <text x="580" y="236" text-anchor="middle" font-size="9" fill="#94a3b8">older devices</text>

  <line x1="450" y1="104" x2="489" y2="104" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="450" y1="223" x2="489" y2="223" stroke="#fcd34d" stroke-width="1.5" marker-end="url(#arr-amber)"/>
</svg>
